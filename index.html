<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week04 Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>แบบฟอร์มสมัครสมาชิก</h2>

        <form action="#" method="post">

            <!-- Text Box -->
            <label>ชื่อ-นามสกุล</label>
            <input type="text" name="fullname" required
                   minlength="3"
                   placeholder="นางสาวจินตนา สมบัติศรี">

            <!-- Password -->
            <label>รหัสผ่าน</label>
            <input type="password" name="password" required
                   minlength="6"
                   placeholder="อย่างน้อย 6 ตัวอักษร">

            <!-- Email -->
            <label>อีเมล</label>
            <input type="email" name="email" required
                   placeholder="68319010010@swdtcmail.com">

            <!-- Radio Button -->
            <label>เพศ</label>
            <div class="radio-group">
                <input type="radio" name="gender" value="ชาย" required> ชาย
                <input type="radio" name="gender" value="หญิง"> หญิง
            </div>

            <!-- Checkbox -->
            <label>ความสนใจ</label>
            <div class="checkbox-group">
                <input type="checkbox" name="interest" value="HTML"> HTML
                <input type="checkbox" name="interest" value="CSS"> CSS
                <input type="checkbox" name="interest" value="JavaScript"> JavaScript
            </div>

            <!-- Select -->
            <label>ระดับชั้น</label>
            <select name="level" required>
                <option value="">-- เลือกระดับชั้น --</option>
                <option value="ปวช">ปวช.</option>
                <option value="ปวส">ปวส.</option>
                <option value="ปริญญาตรี">ปริญญาตรี</option>
            </select>

            <!-- Textarea -->
            <label>ความคิดเห็นเพิ่มเติม</label>
            <textarea name="comment" rows="5"
                placeholder="กรอกความคิดเห็น"></textarea>

            <!-- Submit Button -->
            <button type="submit">ส่งข้อมูล</button>

        </form>
    </div>

</body>
</html>
